name: wheels

on:
  workflow_dispatch:
    inputs:
      pypi_release:
        description: "Release tag whose attached files go to PyPI (empty: build and upload to TestPyPI)"
        required: false
        default: ""
  push:
    tags: ["v*"]

jobs:
  wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest
            target: aarch64
          - os: macos-latest
            target: x86_64
          - os: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.pypi_release == ''
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/tmpest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.event_name == 'workflow_dispatch' && inputs.pypi_release != ''
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tmpest
    permissions:
      contents: read
      id-token: write
    steps:
      - run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern "*.whl" --pattern "*.tar.gz"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.pypi_release }}
      - run: ls -l dist && sha256sum dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
