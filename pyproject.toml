[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "tmpest"
version = "1.4.0"
description = "Measure chromatic jitter in one modality (photometry or spectroscopy) and apply it to synthetic data in the other"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE", "THIRD-PARTY-LICENSES.txt"]
authors = [{ name = "Colin Harrison" }]
requires-python = ">=3.10"
keywords = ["astronomy", "photometry", "spectroscopy", "noise", "time series", "red noise", "stellar activity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["numpy>=1.21.6"]

[project.urls]
Repository = "https://github.com/Astrophysicscolin/tmpest"
Issues = "https://github.com/Astrophysicscolin/tmpest/issues"

[project.optional-dependencies]
dev = ["pytest"]
plot = ["matplotlib"]
examples = ["matplotlib"]

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "tmpest._core"
profile = "release"
exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
