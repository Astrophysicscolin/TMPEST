[package]
name = "tmpest-core"
version = "1.4.0"
edition = "2021"
rust-version = "1.83"
license = "BSD-3-Clause"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310"] }
numpy = "0.29"
ndarray = { version = "0.17", features = ["rayon"] }
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
